services:
  - type: web
    name: lumo-app
    runtime: node
    buildCommand: npm run build
    startCommand: node server/index.js
    # ── Persistente Server-Daten (F033) – VORLAGE, bewusst auskommentiert ─────────────
    # Ohne Disk liegt lumo.db im flüchtigen Dateisystem: Jeder Deploy/Neustart löscht alle
    # Server-Stände. Zum Umschalten die Zeilen unten einkommentieren UND DB_PATH auf /data setzen.
    # Schritte, Prüfung und Rückfall: docs/RENDER-PERSISTENCE.md.
    # Eine Disk gilt nur für EINE Instanz; welcher Instanztyp sie erlaubt und was sie kostet,
    # bitte in der Render-Dokumentation bzw. im Dashboard nachsehen.
    # plan: starter
    # disk:
    #   name: lumo-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      # Pflicht in Production – ohne diese beiden startet bzw. funktioniert Lumo nicht.
      # sync: false = der Wert wird im Render-Dashboard gesetzt, nicht hier.
      # FRONTEND_URL: öffentliche URL der App (CORS-Whitelist), z. B.
      #   https://lumo-app-pbgc.onrender.com
      - key: FRONTEND_URL
        sync: false
      # DB_PATH: Verzeichnis für lumo.db. Der Server bricht in Production ohne
      # DB_PATH ab. ACHTUNG: /tmp überlebt keinen Deploy – alle Server-Stände
      # gehen dann verloren. Für den Launch: Persistent Disk mounten (z. B. /data)
      # oder externe Datenbank. Siehe README, Abschnitt "Deployment (Render)".
      - key: DB_PATH
        sync: false
